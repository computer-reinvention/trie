name: deploy landing to github pages

# Publishes the static site under `landing/` to the public org-pages repo
# `computer-reinvention/computer-reinvention.github.io`, which serves the
# root site at https://computer-reinvention.github.io/.
#
# Auth: a write-scoped SSH deploy key on the public repo. The matching
# private key lives in this repo's Actions secrets as PAGES_DEPLOY_SSH.
# That key can do exactly one thing: git-push to the public repo.

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# A single in-flight deployment per ref is enough; cancel older runs so
# the freshest commit is the one that lands on pages.
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout trie (sparse landing/)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            landing
          sparse-checkout-cone-mode: false

      # Load the deploy key into the agent for this job. The deploy-key
      # action sets up SSH for github.com and ensures git uses it for
      # any push to the matching repo.
      - name: load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PAGES_DEPLOY_SSH }}

      - name: sync landing/ to public pages repo
        # We clone the public repo, mirror the current landing/ contents
        # into its trie/ subdirectory (the org site root is the experiments
        # index; each project lives at /<name>/), and push only if there is
        # an actual diff. The commit message points back at the trie commit
        # that triggered this run so the public history is traceable.
        env:
          SRC_SHA: ${{ github.sha }}
          SRC_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          DEST_DIR="$RUNNER_TEMP/site"
          git clone --depth 1 git@github.com:computer-reinvention/computer-reinvention.github.io.git "$DEST_DIR"

          # Wipe only the trie/ subtree and copy landing/ over it. The rest
          # of the site (root index, sibling project pages) is owned by the
          # pages repo itself and must survive trie deploys.
          rm -rf "$DEST_DIR/trie"
          mkdir -p "$DEST_DIR/trie"
          cp -R landing/. "$DEST_DIR"/trie/

          cd "$DEST_DIR"
          git config user.name  "trie-pages-deploy"
          git config user.email "trie-pages-deploy@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "no changes to publish; skipping push."
            exit 0
          fi

          git commit -m "deploy: ${SRC_REPO}@${SRC_SHA}"
          git push origin HEAD:main
