# managed-by: trie setup (triediff-comment)
# Comments the latest session digest (triefacts/triediffs/*.md) on each PR so
# reviewers see the intent-level summary before opening a single file diff.
# Delete this file (or edit it — trie won't touch a file without the
# managed-by marker above) to opt out. Regenerated by `trie setup` when
# the template evolves.
name: triediff-comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Comment the latest session digest
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          dir="triefacts/triediffs"
          # Timestamp-prefixed names: lexicographic max == newest.
          latest="$(ls "$dir"/*.md 2>/dev/null | sort | tail -1 || true)"
          if [ -z "$latest" ]; then
            echo "no digest files under $dir; nothing to comment"
            exit 0
          fi
          name="$(basename "$latest")"

          # Dedupe: skip when any existing comment already references this file.
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
               --paginate --jq '.[].body' | grep -qF "$name"; then
            echo "digest $name already commented; skipping"
            exit 0
          fi

          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${HEAD_SHA}/${dir}/${name}"
          {
            echo "### Session digest — [\`${name}\`](${url})"
            echo
            cat "$latest"
          } > /tmp/digest-comment.md

          gh pr comment "$PR" --body-file /tmp/digest-comment.md
