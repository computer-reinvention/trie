# trie configuration — see https://github.com/pankajgarkoti/trie

[trie]
version = "0.1.2"

[scope]
# Glob patterns relative to the project root (the directory containing this file).
# Tests are included by default — they encode behavioral spec worth documenting.
# Add `"**/tests/**"` to `exclude` if you'd rather skip them to keep cost down.
#
# Multi-language: Python core + the TypeScript desktop app (app/) and the
# vendored opencode fork (opencode/, a git submodule — only indexed when it is
# checked out). First-party .d.ts files are indexed (declarations are behaviour
# in a typed language); third-party .d.ts under node_modules is excluded below.
include = [
    "**/*.py",
    "**/*.ts",
    "**/*.tsx",
]
exclude = [
    # Prune every hidden dir (.git, .trie, .venv, .opencode, .opencode.bak,
    # .vite, .output, .sst, …) — none are project source.
    "**/.*/**",
    "**/__pycache__/**",
    "**/build/**",
    "**/dist/**",
    # Non-source TS subtrees: dependencies, build output, and generated bundles.
    "**/node_modules/**",
    "**/dist-electron/**",
    "**/out/**",
    "tmp/**",        # session scratch (backfill scripts, notes); never trie-managed
    # Vendored opencode fork (git submodule) — not our source; ~45% of all
    # indexed symbols came from here, swamping the graph with third-party code.
    "opencode/**",
    # Desktop app dev tooling: build scripts (build-*, render-svg, setup-*,
    # validate-*) and the sim/ simulation+verification harness. Internal
    # scaffolding, not app behaviour.
    "app/scripts/**",
]

[triefacts]
# Where the generated Markdown triefact tree lives. Mirrors the source tree under this root.
# Named `triefacts` (not `docs`) to avoid colliding with existing project docs dirs.
root = "triefacts"
# Source tree root, relative to this file. "." means the project root.
source_root = "."

[models]
# Default models for triefact generation. Use "anthropic/<model>" or "openai/<model>" form.
# Switch to a cheaper provider by changing these to e.g. "openai/deepseek-chat" with
# DEEPSEEK_API_BASE / OPENAI_API_KEY env vars set, or use --model on the CLI.
bootstrap = "anthropic/claude-sonnet-4-6"
cascade = "anthropic/claude-sonnet-4-6"

[cascade]
# Default reference-graph traversal depth on incremental sync.
default_depth = 1
# Symbols with more inbound references than this are treated as depth-0 only,
# preventing utility hubs (utils.py, common types) from invalidating the world.
hub_symbol_threshold = 20

[debug]
# Append-only JSONL telemetry for trie's own operations. We bootstrap trie
# with trie and are actively investigating regen quality, so this is on by
# default here.
# Override per-invocation with TRIE_DEBUG=0 (force off) or TRIE_DEBUG=/path.jsonl
# (force on, custom path). See trie/telemetry.py for the event schema.
enabled = true
log_path = "debug.jsonl"          # gitignored; relative to project root
log_to_stderr = false             # mirror events to stderr (dev only; noisy)
capture_args = true               # include MCP tool args in mcp_call events
capture_responses = false         # full response bodies are large; keep off
redact_keys = []                  # field paths to elide, e.g. ["args.predicate"]
